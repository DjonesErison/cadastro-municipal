<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Formulário Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-blue-900 text-white py-6 shadow-md">
        <div class="max-w-md mx-auto px-4 text-center">
            <div class="w-12 h-12 bg-blue-800 rounded-full flex items-center justify-center mx-auto mb-2 border border-blue-700 shadow-inner">
                <i class="fa-solid fa-id-card text-xl text-blue-300"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide">Formulário de Cadastramento</h1>
            <p class="text-xs text-blue-200 mt-1">Identificação e Registro de Servidor / Colaborador</p>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-8 w-full flex-grow">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            
            <div id="msgSucesso" class="hidden mb-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-center">
                <i class="fa-solid fa-circle-check text-emerald-600 text-3xl mb-2"></i>
                <h3 class="text-sm font-bold text-emerald-900">Cadastro Realizado com Sucesso!</h3>
                <p class="text-xs text-emerald-700 mt-1">Seus dados foram salvos com sucesso no sistema.</p>
                <button onclick="novoCadastro()" class="mt-4 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg shadow transition">
                    Realizar Novo Cadastro
                </button>
            </div>

            <form id="cadForm" onsubmit="salvarCadastroPublico(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Nome Completo *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-regular fa-user text-sm"></i>
                        </span>
                        <input type="text" id="nome" required placeholder="Ex: Maria Silva" 
                            class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Telefone / WhatsApp *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-phone text-sm"></i>
                        </span>
                        <input type="tel" id="telefone" required value="(87) 98805-" maxlength="15"
                            oninput="aplicarMascaraTelefone(this)"
                            class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-medium text-slate-800">
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1">Formato obrigatório: (xx) xxxxx-xxxx</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">E-mail *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-regular fa-envelope text-sm"></i>
                        </span>
                        <input type="email" id="email" required placeholder="nome@exemplo.com" 
                            class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Cargo *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-user-tie text-sm"></i>
                        </span>
                        <select id="cargo" required 
                            class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            <option value="" disabled selected>Selecione o cargo...</option>
                            <option value="Secretário">Secretário</option>
                            <option value="Secretário Executivo">Secretário Executivo</option>
                            <option value="Diretor">Diretor</option>
                            <option value="Gerente">Gerente</option>
                            <option value="Assessor">Assessor</option>
                            <option value="Coordenador">Coordenador</option>
                            <option value="Chefe de Setor">Chefe de Setor</option>
                            <option value="Servidor Efetivo">Servidor Efetivo</option>
                            <option value="Servidor Comissionado">Servidor Comissionado</option>
                            <option value="Estagiário / Colaborador">Estagiário / Colaborador</option>
                            <option value="Outro Cargo">Outro Cargo</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Secretaria / Órgão / Autarquia *</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-building-user text-sm"></i>
                        </span>
                        <select id="secretaria" required 
                            class="w-full pl-9 pr-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            <option value="" disabled selected>Selecione a secretaria/órgão...</option>
                            <option value="Prefeitura Municipal de Petrolina">Prefeitura Municipal de Petrolina</option>
                            <option value="Gabinete do Prefeito">Gabinete do Prefeito</option>
                            <option value="AMMA - Agência Municipal do Meio Ambiente">AMMA - Agência Municipal do Meio Ambiente</option>
                            <option value="AMMPLA - Autarquia Municipal de Mobilidade de Petrolina">AMMPLA - Autarquia Municipal de Mobilidade de Petrolina</option>
                            <option value="FACAPE - Autarquia Educacional do Vale do São Francisco">FACAPE - Autarquia Educacional do Vale do São Francisco</option>
                            <option value="IGPREV - Instituto de Previdência dos Servidores de Petrolina">IGPREV - Instituto de Previdência dos Servidores de Petrolina</option>
                            <option value="Casa Civil">Casa Civil</option>
                            <option value="Assistência Social e Combate à Fome">Assistência Social e Combate à Fome</option>
                            <option value="Comunicação">Comunicação</option>
                            <option value="Desenvolvimento Econômico, Turismo e Inovação">Desenvolvimento Econômico, Turismo e Inovação</option>
                            <option value="Desenvolvimento Rural">Desenvolvimento Rural</option>
                            <option value="Desenvolvimento Urbano, Habitação e Sustentabilidade">Desenvolvimento Urbano, Habitação e Sustentabilidade</option>
                            <option value="Educação, Cultura e Esporte">Educação, Cultura e Esporte</option>
                            <option value="Governo">Governo</option>
                            <option value="Infraestrutura e Mobilidade">Infraestrutura e Mobilidade</option>
                            <option value="Licitações e Contratos">Licitações e Contratos</option>
                            <option value="Planejamento, Gestão e Finanças">Planejamento, Gestão e Finanças</option>
                            <option value="Receitas Municipais">Receitas Municipais</option>
                            <option value="Saúde">Saúde</option>
                            <option value="Segurança Pública">Segurança Pública</option>
                            <option value="Serviços Públicos e Defesa Civil">Serviços Públicos e Defesa Civil</option>
                            <option value="Outro / Órgão Parceiro">Outro / Órgão Parceiro</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="btnSubmit"
                    class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center space-x-2 mt-4 text-sm">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Confirmar Cadastro</span>
                </button>
            </form>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-400">
        <p>Portal de Captação e Registro &copy; 2026</p>
    </footer>

    <script>
        const GOOGLE_SCRIPT_URL = ""; 

        function aplicarMascaraTelefone(input) {
            let value = input.value.replace(/\D/g, "");
            
            if (!value.startsWith("87")) {
                value = "87" + value.replace(/^87/, "");
            }
            if (value.length > 11) value = value.slice(0, 11);

            let ddd = value.slice(0, 2);
            let parte1 = value.slice(2, 7);
            let parte2 = value.slice(7, 11);

            let formatted = `(${ddd})`;
            if (parte1) formatted += ` ${parte1}`;
            if (parte2) formatted += `-${parte2}`;

            input.value = formatted;
        }

        async function salvarCadastroPublico(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Enviando...</span>`;

            const payload = {
                nome: document.getElementById('nome').value.trim(),
                telefone: document.getElementById('telefone').value.trim(),
                email: document.getElementById('email').value.trim(),
                cargo: document.getElementById('cargo').value,
                secretaria: document.getElementById('secretaria').value
            };

            let cadastros = JSON.parse(localStorage.getItem('cadastros_secretaria')) || [];
            cadastros.push({...payload, id: Date.now(), data: new Date().toLocaleString('pt-BR')});
            localStorage.setItem('cadastros_secretaria', JSON.stringify(cadastros));

            if(GOOGLE_SCRIPT_URL) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch(e) {
                    console.log("Erro ao sincronizar planilha online:", e);
                }
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> <span>Confirmar Cadastro</span>`;
            document.getElementById('cadForm').reset();
            document.getElementById('telefone').value = "(87) 98805-";
            document.getElementById('cadForm').classList.add('hidden');
            document.getElementById('msgSucesso').classList.remove('hidden');
        }

        function novoCadastro() {
            document.getElementById('cadForm').classList.remove('hidden');
            document.getElementById('telefone').value = "(87) 98805-";
            document.getElementById('msgSucesso').classList.add('hidden');
        }
    </script>
</body>
</html>
