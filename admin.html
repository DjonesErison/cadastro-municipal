<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Cadastros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS e jspdf para exportação -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 text-white py-6 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-blue-400"></i> Painel Administrativo de Cadastros
                </h1>
                <p class="text-xs text-slate-400 mt-1">Gestão e Monitoramento de Cadastros Municipais</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="carregarDados()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> Atualizar Dados
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            
            <!-- Barra de Ações e Contadores -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                <div>
                    <h2 class="text-base font-bold text-slate-800">Relatório Geral de Cadastrados (Planilha)</h2>
                    <p id="totalRegistros" class="text-xs text-slate-500 mt-0.5">Carregando registros...</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button onclick="exportarExcel()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-file-excel"></i> Excel (Abas por Secretaria)
                    </button>
                    <button onclick="exportarPDF()" class="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-file-pdf"></i> PDF (Agrupado)
                    </button>
                </div>
            </div>

            <!-- Campo de Busca -->
            <div class="mb-6">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-sm"></i>
                    </span>
                    <input type="text" id="filtroBusca" oninput="filtrarTabela()" placeholder="Buscar por nome, telefone, e-mail, cargo ou secretaria..." 
                        class="w-full pl-10 pr-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
            </div>

            <!-- Tabela de Dados -->
            <div class="overflow-x-auto rounded-xl border border-slate-200">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs font-bold uppercase tracking-wider border-b border-slate-200">
                            <th class="py-3 px-4">#</th>
                            <th class="py-3 px-4">Data/Hora</th>
                            <th class="py-3 px-4">Nome Completo</th>
                            <th class="py-3 px-4">Telefone</th>
                            <th class="py-3 px-4">E-mail</th>
                            <th class="py-3 px-4">Cargo</th>
                            <th class="py-3 px-4">Secretaria / Órgão</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo" class="text-xs divide-y divide-slate-100 text-slate-700">
                        <tr>
                            <td colspan="7" class="text-center py-8 text-slate-400">
                                <i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><br>Carregando dados da planilha...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-400 bg-white border-t border-slate-200">
        <p>Painel Administrativo &copy; 2026</p>
    </footer>

    <script>
        // Insira o link atualizado do seu Web App do Google Apps Script aqui:
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmzQKejZO-V1wJKenNotpxwJYbwh7cie6j1a8c4MpLVcpxbdatmaIoKu-eluk4ENsz/exec";

        let listaGlobalCadastros = [];

        async function carregarDados() {
            const corpo = document.getElementById('tabelaCorpo');
            const totalTxt = document.getElementById('totalRegistros');
            
            corpo.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-lg mb-2"></i><br>Buscando dados atualizados...</td></tr>`;

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                
                if (Array.isArray(data)) {
                    listaGlobalCadastros = data;
                    renderizarTabela(listaGlobalCadastros);
                } else {
                    throw new Error("Formato inválido retornado pelo servidor.");
                }
            } catch (error) {
                console.error("Erro ao carregar:", error);
                corpo.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-rose-500 font-medium"><i class="fa-solid fa-triangle-exclamation text-lg mb-2"></i><br>Erro ao carregar dados da planilha. Verifique a conexão ou a URL do script.</td></tr>`;
                totalTxt.innerText = "Total acumulado: 0 registros";
            }
        }

        function renderizarTabela(dados) {
            const corpo = document.getElementById('tabelaCorpo');
            const totalTxt = document.getElementById('totalRegistros');
            
            totalTxt.innerText = `Total acumulado: ${dados.length} registro(s)`;

            if (dados.length === 0) {
                corpo.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-400">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            corpo.innerHTML = dados.map((item, index) => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="py-3 px-4 font-medium text-slate-500">${index + 1}</td>
                    <td class="py-3 px-4 whitespace-nowrap">${item.data || '-'}</td>
                    <td class="py-3 px-4 font-semibold text-slate-800">${item.nome || '-'}</td>
                    <td class="py-3 px-4 whitespace-nowrap">${item.telefone || '-'}</td>
                    <td class="py-3 px-4">${item.email || '-'}</td>
                    <td class="py-3 px-4">${item.cargo || '-'}</td>
                    <td class="py-3 px-4 font-medium text-blue-900">${item.secretaria || '-'}</td>
                </tr>
            `).join('');
        }

        function filtrarTabela() {
            const termo = document.getElementById('filtroBusca').value.toLowerCase();
            const filtrados = listaGlobalCadastros.filter(item => {
                return (
                    (item.nome && item.nome.toLowerCase().includes(termo)) ||
                    (item.telefone && item.telefone.toLowerCase().includes(termo)) ||
                    (item.email && item.email.toLowerCase().includes(termo)) ||
                    (item.cargo && item.cargo.toLowerCase().includes(termo)) ||
                    (item.secretaria && item.secretaria.toLowerCase().includes(termo))
                );
            });
            renderizarTabela(filtrados);
        }

        function exportarExcel() {
            if (listaGlobalCadastros.length === 0) {
                alert("Não há dados para exportar.");
                return;
            }

            // Cria um workbook principal
            const wb = XLSX.utils.book_new();

            // Aba Geral
            const wsGeral = XLSX.utils.json_to_sheet(listaGlobalCadastros);
            XLSX.utils.book_append_sheet(wb, wsGeral, "Geral");

            // Agrupa por Secretaria para criar abas separadas
            const secretariasMap = {};
            listaGlobalCadastros.forEach(item => {
                const sec = item.secretaria || "Outros";
                if (!secretariasMap[sec]) secretariasMap[sec] = [];
                secretariasMap[sec].push(item);
            });

            for (const [secName, itens] of Object.entries(secretariasMap)) {
                // Nome das abas no Excel tem limite de 31 caracteres
                const nomeAba = secName.substring(0, 31).replace(/[\/?*[\]]/g, "");
                const wsSec = XLSX.utils.json_to_sheet(itens);
                XLSX.utils.book_append_sheet(wb, wsSec, nomeAba);
            }

            XLSX.writeFile(wb, "Cadastros_Municipais_Secretarias.xlsx");
        }

        function exportarPDF() {
            if (listaGlobalCadastros.length === 0) {
                alert("Não há dados para exportar.");
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.text("Relatório Geral de Cadastros Municipais", 14, 20);
            
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 28);

            const colunas = ["Data/Hora", "Nome", "Telefone", "Cargo", "Secretaria"];
            const linhas = listaGlobalCadastros.map(item => [
                item.data,
                item.nome,
                item.telefone,
                item.cargo,
                item.secretaria
            ]);

            doc.autoTable({
                head: [colunas],
                body: linhas,
                startY: 35,
                styles: { fontSize: 8 },
                headStyles: { fillColor: [30, 58, 138] }
            });

            doc.save("Relatorio_Cadastros.pdf");
        }

        // Carrega os dados automaticamente ao abrir a página
        window.onload = carregarDados;
    </script>
</body>
</html>
